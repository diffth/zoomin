<!doctype html>
<html class="light" lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00288e" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <title>Zoomin AI - 셀카로 만드는 여권·증명사진 AI 변환기</title>
  <meta name="description"
    content="셀카나 일반 인물 사진을 여권, 주민등록증, 운전면허증 등 공식 규격에 맞는 증명사진으로 3초 만에 변환해 보세요. AI 기반 배경 제거 및 규격 검증 제공." />
  <meta name="keywords" content="증명사진, 여권사진, 여권사진 만들기, 증명사진 ai, 배경제거, 여권 규격, id photo, passport photo, ai 증명사진" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter has no Hangul glyphs, so Korean would fall back to whatever the OS
         provides. Noto Sans KR follows it in the stack and the browser picks per
         glyph; Google Fonts subsets it by unicode-range so only used ranges load. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />

  <!-- 구조화 데이터 (JSON-LD) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "IDSnap AI",
        "url": "https://idsnap.ai",
        "description": "AI 기반 배경 제거 및 규격 검증 기능을 제공하는 여권 및 증명사진 온라인 변환기",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires HTML5 Support",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "KRW"
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
